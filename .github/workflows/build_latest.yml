name: Build Latest

on:
  push:
    branches:
      - master
  workflow_dispatch:

# RF-87：快速连续 master push 会排队并发跑完整 5 目标构建；同分支新 push 取消在途。
concurrency:
  group: build-latest-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SDK_VERSION: "10.0.300"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  set-date:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.get_date.outputs.date }}
    steps:
      - name: Get Date in UTC+8
        id: get_date
        run: echo "date=$(date -u -d '8 hours' +'%Y%m%d')" >> "$GITHUB_OUTPUT"

  # 构建物必须建立在通过的测试之上，否则测试形同虚设
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install ffmpeg (for LocalIntegration gate)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Test
        # 单元测试 + 本地可重复的 ffmpeg 集成测试（无外部网络依赖，可硬性门禁）：
        # 此前只跑单元测试，master 推送会绕过 FFmpeg 集成门禁。
        run: dotnet test -c Release --filter "Category!=Integration&Category!=NetworkIntegration"

  build-win-x64-arm64:
    runs-on: windows-latest
    needs: [set-date, test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install zip
        run: choco install zip --no-progress --yes

      - name: Publish [win]
        run: |
          dotnet publish BBDown -r win-x64 -c Release -o artifact
          dotnet publish BBDown -r win-arm64 -c Release -o artifact-arm64

      - name: Package [win]
        run: |
          cd artifact
          zip ../BBDown_${{ needs.set-date.outputs.date }}_win-x64.zip BBDown.exe device.wvd
          cd ../artifact-arm64
          zip ../BBDown_${{ needs.set-date.outputs.date }}_win-arm64.zip BBDown.exe device.wvd

      - name: Upload Artifact [win-x64]
        uses: actions/upload-artifact@v5
        with:
          name: BBDown_win-x64
          path: BBDown_${{ needs.set-date.outputs.date }}_win-x64.zip
          retention-days: 7

      - name: Upload Artifact [win-arm64]
        uses: actions/upload-artifact@v5
        with:
          name: BBDown_win-arm64
          path: BBDown_${{ needs.set-date.outputs.date }}_win-arm64.zip
          retention-days: 7

  build-linux-x64-arm64:
    runs-on: ubuntu-latest
    needs: [set-date, test]

    steps:
      - uses: actions/checkout@v4

      - name: Build x64 in Ubuntu 18.04 container (for glibc 2.27 compatibility)
        run: |
          # 在 Ubuntu 18.04 容器中执行完整构建流程
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            ubuntu:18.04 \
            bash -c "
              set -e

              # 安装编译和运行依赖
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y wget build-essential clang libicu-dev zlib1g libcurl4-openssl-dev libkrb5-dev

              # 下载并安装 .NET SDK
              DOTNET_SDK_VERSION='${{ env.DOTNET_SDK_VERSION }}'
              DOTNET_SDK_URL=\"https://builds.dotnet.microsoft.com/dotnet/Sdk/\${DOTNET_SDK_VERSION}/dotnet-sdk-\${DOTNET_SDK_VERSION}-linux-x64.tar.gz\"
              wget -nv \"\$DOTNET_SDK_URL\" -O dotnet-sdk.tar.gz
              mkdir -p /opt/dotnet
              tar -xzf dotnet-sdk.tar.gz -C /opt/dotnet
              export PATH=\"/opt/dotnet:\$PATH\"

              # 编译 Native AOT 输出到挂载的 artifact 目录
              dotnet publish BBDown -r linux-x64 -c Release -o /workspace/artifact
            "

      - name: Build arm64 in Ubuntu 18.04 container (for glibc 2.27 compatibility)
        run: |
          # 在 Ubuntu 18.04 容器中执行完整构建流程
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            mcr.microsoft.com/dotnet-buildtools/prereqs:ubuntu-18.04-cross-arm64-20220312201346-b2c2436 \
            bash -c "
              set -e

              # 下载并安装 .NET SDK
              DOTNET_SDK_VERSION='${{ env.DOTNET_SDK_VERSION }}'
              DOTNET_SDK_URL=\"https://builds.dotnet.microsoft.com/dotnet/Sdk/\${DOTNET_SDK_VERSION}/dotnet-sdk-\${DOTNET_SDK_VERSION}-linux-x64.tar.gz\"
              wget -nv \"\$DOTNET_SDK_URL\" -O dotnet-sdk.tar.gz
              mkdir -p /opt/dotnet
              tar -xzf dotnet-sdk.tar.gz -C /opt/dotnet
              export PATH=\"/opt/dotnet:\$PATH\"

              # 编译 Native AOT 输出到挂载的 artifact 目录
              dotnet publish BBDown -r linux-arm64 -c Release -p:StripSymbols=true -p:CppCompilerAndLinker=clang-9 -p:SysRoot=/crossrootfs/arm64 -o /workspace/artifact-arm64
            "

      - name: Package [linux]
        run: |
          cd artifact
          zip ../BBDown_${{ needs.set-date.outputs.date }}_linux-x64.zip BBDown device.wvd
          cd ../artifact-arm64
          zip ../BBDown_${{ needs.set-date.outputs.date }}_linux-arm64.zip BBDown device.wvd

      - name: Upload Artifact [linux-x64]
        uses: actions/upload-artifact@v5
        with:
          name: BBDown_linux-x64
          path: BBDown_${{ needs.set-date.outputs.date }}_linux-x64.zip
          retention-days: 7

      - name: Upload Artifact [linux-arm64]
        uses: actions/upload-artifact@v5
        with:
          name: BBDown_linux-arm64
          path: BBDown_${{ needs.set-date.outputs.date }}_linux-arm64.zip
          retention-days: 7

  build-mac-x64-arm64:
    runs-on: macos-latest
    needs: [set-date, test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Publish [osx]
        run: |
          dotnet publish BBDown -r osx-x64 -c Release -o artifact
          dotnet publish BBDown -r osx-arm64 -c Release -o artifact-arm64

      - name: Package [osx]
        run: |
          cd artifact
          zip ../BBDown_${{ needs.set-date.outputs.date }}_osx-x64.zip BBDown device.wvd
          cd ../artifact-arm64
          zip ../BBDown_${{ needs.set-date.outputs.date }}_osx-arm64.zip BBDown device.wvd

      - name: Upload Artifact [osx-x64]
        uses: actions/upload-artifact@v5
        with:
          name: BBDown_osx-x64
          path: BBDown_${{ needs.set-date.outputs.date }}_osx-x64.zip
          retention-days: 7

      - name: Upload Artifact [osx-arm64]
        uses: actions/upload-artifact@v5
        with:
          name: BBDown_osx-arm64
          path: BBDown_${{ needs.set-date.outputs.date }}_osx-arm64.zip
          retention-days: 7

  # Docker 镜像构建 + serve 启动冒烟：验证 Dockerfile 能产出可运行的 AOT 镜像，
  # 且 serve 在非回环监听下正确要求 token（默认 CMD 拒绝启动是预期行为）。
  docker-build-smoke:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t bbdown:test .

      - name: Smoke test — 默认 CMD（0.0.0.0 无 token）应拒绝启动
        run: |
          set +e
          output=$(docker run --rm bbdown:test 2>&1)
          exit_code=$?
          set -e
          echo "exit=$exit_code"
          echo "$output"
          if [ $exit_code -eq 0 ]; then
            echo "错误：非回环监听未配置 token 应拒绝启动（非零退出），实际却成功了" >&2
            exit 1
          fi
          echo "$output" | grep -q "serve-token" || {
            echo "错误：拒绝信息应提示 --serve-token，实际输出: $output" >&2
            exit 1
          }

      - name: Smoke test — 显式 token 应正常启动并可调用 API
        run: |
          # 后台启动容器（serve 监听 0.0.0.0:23333 + token）
          docker run -d --name bbdown-smoke -p 23333:23333 bbdown:test \
            serve -l http://0.0.0.0:23333 --serve-token smoketest
          # 等待启动（AOT 二进制直接启动，通常 1-2s）
          for i in $(seq 1 20); do
            if curl -sf -H "X-Serve-Token: smoketest" http://127.0.0.1:23333/get-tasks/ >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          # 无 token 应 401，带 token 应 200
          code_no_token=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:23333/get-tasks/)
          code_with_token=$(curl -s -o /dev/null -w "%{http_code}" -H "X-Serve-Token: smoketest" http://127.0.0.1:23333/get-tasks/)
          echo "no-token=$code_no_token with-token=$code_with_token"
          [ "$code_no_token" = "401" ] || { echo "无 token 应返回 401，实际 $code_no_token" >&2; exit 1; }
          [ "$code_with_token" = "200" ] || { echo "带 token 应返回 200，实际 $code_with_token" >&2; exit 1; }
          docker rm -f bbdown-smoke >/dev/null
