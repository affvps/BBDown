name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  DOTNET_SDK_VERSION: "10.0.300"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  packages: write

jobs:
  # 发布路径同样必须先过测试：打了 tag 就直接产出 release 会把回归带给所有用户
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install ffmpeg (for LocalIntegration gate)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Test
        # 单元测试 + 本地可重复的 ffmpeg 集成测试（无外部网络依赖，可硬性门禁）：
        # 此前只跑单元测试，直接推送 tag 会绕过 FFmpeg 集成门禁。
        run: dotnet test -c Release --filter "Category!=Integration&Category!=NetworkIntegration"

  build-win-x64-arm64:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install zip
        run: choco install zip --no-progress --yes

      - name: Publish [win-x64]
        run: dotnet publish BBDown -r win-x64 -c Release -o artifact-win-x64

      - name: Publish [win-arm64]
        run: dotnet publish BBDown -r win-arm64 -c Release -o artifact-win-arm64

      - name: Package [win]
        run: |
          $ver = "${{ github.ref_name }}"
          cd artifact-win-x64
          zip ../BBDown_${ver}_win-x64.zip BBDown.exe
          cd ../artifact-win-arm64
          zip ../BBDown_${ver}_win-arm64.zip BBDown.exe

      - name: Upload Artifact [win-x64]
        uses: actions/upload-artifact@v5
        with:
          name: BBDown_win-x64
          path: BBDown_${{ github.ref_name }}_win-x64.zip
          retention-days: 7

      - name: Upload Artifact [win-arm64]
        uses: actions/upload-artifact@v5
        with:
          name: BBDown_win-arm64
          path: BBDown_${{ github.ref_name }}_win-arm64.zip
          retention-days: 7

  build-linux-x64-arm64:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build x64 in Ubuntu 18.04 container (for glibc 2.27 compatibility)
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            ubuntu:18.04 \
            bash -c "
              set -e
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y wget build-essential clang libicu-dev zlib1g libcurl4-openssl-dev libkrb5-dev
              DOTNET_SDK_VERSION='${{ env.DOTNET_SDK_VERSION }}'
              DOTNET_SDK_URL=\"https://builds.dotnet.microsoft.com/dotnet/Sdk/\${DOTNET_SDK_VERSION}/dotnet-sdk-\${DOTNET_SDK_VERSION}-linux-x64.tar.gz\"
              wget -nv \"\$DOTNET_SDK_URL\" -O dotnet-sdk.tar.gz
              mkdir -p /opt/dotnet
              tar -xzf dotnet-sdk.tar.gz -C /opt/dotnet
              export PATH=\"/opt/dotnet:\$PATH\"
              dotnet publish BBDown -r linux-x64 -c Release -o /workspace/artifact-linux-x64
            "

      - name: Build arm64 in Ubuntu 18.04 container (for glibc 2.27 compatibility)
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            mcr.microsoft.com/dotnet-buildtools/prereqs:ubuntu-18.04-cross-arm64-20220312201346-b2c2436 \
            bash -c "
              set -e
              DOTNET_SDK_VERSION='${{ env.DOTNET_SDK_VERSION }}'
              DOTNET_SDK_URL=\"https://builds.dotnet.microsoft.com/dotnet/Sdk/\${DOTNET_SDK_VERSION}/dotnet-sdk-\${DOTNET_SDK_VERSION}-linux-x64.tar.gz\"
              wget -nv \"\$DOTNET_SDK_URL\" -O dotnet-sdk.tar.gz
              mkdir -p /opt/dotnet
              tar -xzf dotnet-sdk.tar.gz -C /opt/dotnet
              export PATH=\"/opt/dotnet:\$PATH\"
              dotnet publish BBDown -r linux-arm64 -c Release -p:StripSymbols=true -p:CppCompilerAndLinker=clang-9 -p:SysRoot=/crossrootfs/arm64 -o /workspace/artifact-linux-arm64
            "

      - name: Package [linux]
        run: |
          cd artifact-linux-x64
          zip ../BBDown_${{ github.ref_name }}_linux-x64.zip BBDown
          cd ../artifact-linux-arm64
          zip ../BBDown_${{ github.ref_name }}_linux-arm64.zip BBDown

      - name: Upload Artifact [linux-x64]
        uses: actions/upload-artifact@v5
        with:
          name: BBDown_linux-x64
          path: BBDown_${{ github.ref_name }}_linux-x64.zip
          retention-days: 7

      - name: Upload Artifact [linux-arm64]
        uses: actions/upload-artifact@v5
        with:
          name: BBDown_linux-arm64
          path: BBDown_${{ github.ref_name }}_linux-arm64.zip
          retention-days: 7

  build-mac-x64-arm64:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Publish [osx-x64]
        run: dotnet publish BBDown -r osx-x64 -c Release -o artifact-osx-x64

      - name: Publish [osx-arm64]
        run: dotnet publish BBDown -r osx-arm64 -c Release -o artifact-osx-arm64

      - name: Package [osx]
        run: |
          cd artifact-osx-x64
          zip ../BBDown_${{ github.ref_name }}_osx-x64.zip BBDown
          cd ../artifact-osx-arm64
          zip ../BBDown_${{ github.ref_name }}_osx-arm64.zip BBDown

      - name: Upload Artifact [osx-x64]
        uses: actions/upload-artifact@v5
        with:
          name: BBDown_osx-x64
          path: BBDown_${{ github.ref_name }}_osx-x64.zip
          retention-days: 7

      - name: Upload Artifact [osx-arm64]
        uses: actions/upload-artifact@v5
        with:
          name: BBDown_osx-arm64
          path: BBDown_${{ github.ref_name }}_osx-arm64.zip
          retention-days: 7

  create-release:
    runs-on: ubuntu-latest
    needs: [build-win-x64-arm64, build-linux-x64-arm64, build-mac-x64-arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 只下载本次发布的 zip（pattern BBDown_*）：本 run 的 artifact 里还含 docker-publish 的
      # buildx 缓存产物（aliveranme~BBDown~<hash>.dockerbuild），与 release 无关；
      # 全量下载（不带 pattern）既拉下无关物，又会把偶发传输失败放大成整个 job 失败——
      # 曾以 'Artifact download failed after 5 retries' 拖挂 create-release。
      - name: Download artifacts (release zips only)
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
          pattern: BBDown_*

      - name: Build release notes
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")

          # Extract changelog section for this version
          NOTES_FILE=$(mktemp)
          {
            # Changelog for this version
            if [ -f CHANGELOG.md ]; then
              awk "/^## \\[$VERSION\\]/{flag=1; next} /^## \\[/{if(flag) exit} flag" CHANGELOG.md
            fi

            echo ""
            echo "---"
            echo ""

            # Commits since previous tag
            echo "## Commits"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log --pretty=format:'- %s' --no-merges "$PREV_TAG..$TAG" || true
            else
              echo "Initial release."
            fi
            echo ""

            # Downloads table
            echo "## Downloads"
            echo ""
            echo "| Platform | Architecture |"
            echo "|----------|-------------|"
            echo "| Windows  | x64, arm64  |"
            echo "| Linux    | x64, arm64  |"
            echo "| macOS    | x64, arm64  |"
            echo ""

            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
            fi
          } >> "$NOTES_FILE"

          # 幂等发布：release 可能已被手动/脚本先行创建——同名会导致 gh release create
          # 直接失败（'a release with the same tag name already exists'），构建产物永远传不上去。
          # 先探测：已存在则跳过创建、仅补齐 assets；不存在则正常创建并随附 assets。
          # --clobber 覆盖同名资产，保证重复运行/重跑安全。
          # 生成 SHA256 校验文件：供用户下载后验证包完整性。
          # 必须在 artifacts/ 内生成："sha256sum artifacts/*.zip" 会把工作目录前缀写进文件名列，
          # 用户下载后直接 `sha256sum -c sha256sums.txt` 必然报 FAILED open or read，
          # 得先自建一个同名目录才能校验——校验文件因此形同虚设。
          (cd artifacts && sha256sum *.zip > sha256sums.txt)
          RELEASE_ASSETS="artifacts/*.zip artifacts/sha256sums.txt"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — skipping creation, uploading assets"
            gh release upload "$TAG" $RELEASE_ASSETS --clobber
          else
            gh release create "$TAG" \
              --title "BBDown ${TAG}" \
              --notes-file "$NOTES_FILE" \
              ${{ contains(github.ref_name, '-') && '--prerelease' || '' }} \
              $RELEASE_ASSETS
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Docker 镜像发布 GHCR：测试通过即推送（镜像不依赖 zip 构建，无需等 build job）。
  # 镜像 ghcr.io/aliveranme/bbdown：latest 始终指向最新 release。
  docker-publish:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/aliveranme/bbdown:latest
            ghcr.io/aliveranme/bbdown:${{ github.ref_name }}
